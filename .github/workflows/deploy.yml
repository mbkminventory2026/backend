name: Deploy Backend to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy main on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
          UPLOADS_HOST_PATH: ${{ vars.UPLOADS_HOST_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: PROD_DB_URL,UPLOADS_HOST_PATH
          command_timeout: 30m
          script: |
            set -eu
            cd backend/

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "ERROR: backend worktree on VPS has tracked changes"
              exit 1
            fi

            git switch main
            git pull --ff-only origin main
            make prod-deploy
