services:
  # ── Development: Air hot-reload inside Docker ──────────────────────
  dev:
    container_name: permatatex-dev
    profiles: ["development"]
    build:
      context: .
      dockerfile: Dockerfile.dev
      network: host
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - permatatex-net

  # ── Production: optimized static binary ────────────────────────────
  app:
    container_name: permatatex-backend
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: "8080"
      GIN_MODE: "${GIN_MODE:-release}"
      CORS_ALLOW_ORIGIN: "${CORS_ALLOW_ORIGIN:-*}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-postgres}"
      DB_NAME: "${DB_NAME:-permatatex_inventory}"
      DB_SSLMODE: "${DB_SSLMODE:-disable}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:?TURNSTILE_SECRET is required}"
    ports:
      - "8080:8080"
    volumes:
      # ./uploads is a local-only fallback. prod-deploy requires an explicit
      # absolute UPLOADS_HOST_PATH outside the repository.
      - type: bind
        source: "${UPLOADS_HOST_PATH:-./uploads}"
        target: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 15s
    networks:
      - permatatex-net

  db:
    container_name: permatatex-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${DB_NAME:-permatatex_inventory}"
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - permatatex-net

volumes:
  pgdata:
  gomodcache:

networks:
  permatatex-net:
    name: permatatex-shared-net
    external: true
